/* ------------------------------------------------------------- textures */
function brickTex(br, bg, bb, moss, seed) {

    const row = y >> 4, bx = (x + (row & 1) * 16) & 31;

/* ======================= shooting effects ======================= */
let smokes = [], tracers = [], muzzleGlow = 0;
SPR.spark = mkSprite(32, 32, g => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 15); gr.addColorStop(0, 'rgba(255,255,230,1)'); gr.addColorStop(.35, 'rgba(255,200,90,.8)'); gr.addColorStop(1, 'rgba(255,120,20,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });

{
