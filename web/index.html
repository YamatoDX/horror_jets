<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nosferatu: Blood Moon Sorties</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#cfc6b4}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  #hud{pointer-events:none}
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
      background:radial-gradient(ellipse at center,rgba(10,0,0,.72),rgba(0,0,0,.95));padding:4vmin;box-sizing:border-box;overflow:auto;z-index:2}
  #ov h1{font-size:clamp(26px,5.2vmin,60px);letter-spacing:.12em;margin:0 0 .15em;color:#b11414;text-shadow:0 0 18px #600,0 2px 0 #000;font-weight:normal}
  #ov h2{font-size:clamp(13px,2.2vmin,24px);margin:0 0 1em;font-style:italic;color:#8a8372;font-weight:normal;letter-spacing:.08em}
  #ov p{margin:.22em 0;font-size:clamp(11px,1.8vmin,18px);line-height:1.45;max-width:54em}
  #ov .k{display:inline-block;border:1px solid #6b6252;border-radius:4px;padding:0 .45em;margin:0 .1em;background:#16120e;color:#e0d6bd;font-size:.9em}
  #ov .sec{color:#d8c9a0;margin-top:.9em;letter-spacing:.1em;font-size:clamp(12px,1.9vmin,19px)}
  #ov .go{margin-top:1.3em;font-size:clamp(14px,2.5vmin,26px);color:#d8c9a0;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .hide{display:none!important}
  #err{position:absolute;left:0;bottom:0;color:#f66;font:11px monospace;white-space:pre-wrap;z-index:9;max-width:60%}
  #ov .panel{width:min(760px,100%);margin:auto;text-align:left}
  #ov .eyebrow{font:12px Consolas,monospace;letter-spacing:.2em;color:#a69b82;margin-bottom:18px}
  #ov .intro{font-size:18px;max-width:38em;color:#e3d9c5;margin:20px 0}
  #ov .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
  #ov .step{padding:16px;border:1px solid #524238;background:rgba(30,22,22,.75);line-height:1.5}
  #ov .step b{display:block;color:#e7c47e;margin-bottom:8px;font:14px Consolas,monospace}
  #ov .step span{font:14px/1.6 Georgia,serif;color:#b9b0a0}
  #ov .actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 16px}
  #ov button{cursor:pointer;border:1px solid #8e7350;padding:13px 23px;background:#241e1b;color:#e8d8b5;font:15px Georgia,serif;min-height:46px}
  #ov button.primary{background:#9c242b;border-color:#c34449;color:#fff1dc}
  #ov button:hover{filter:brightness(1.3)}
  #ov button:focus-visible,#ov summary:focus-visible,#ov input:focus-visible{outline:2px solid #ffd35a;outline-offset:5px}
  #ov details{border-top:1px solid #51453a;padding:16px 0}
  #ov summary{cursor:pointer;color:#e0c698;font-size:16px}
  #ov .settings{display:grid;gap:18px;padding:22px 0 6px;max-width:480px}
  #ov label{display:grid;grid-template-columns:1fr 160px 48px;gap:12px;align-items:center;font:14px Consolas,monospace}
  #ov input{accent-color:#c54b4b;width:100%}
  #ov .check{display:flex}#ov .check input{width:18px;height:18px}
  #ov .footnote{font:12px/1.7 Consolas,monospace;color:#a99f8c}
  @media(max-width:600px){#ov .steps{grid-template-columns:1fr;gap:6px}#ov .step{padding:10px}#ov label{grid-template-columns:1fr 100px 40px}#ov{justify-content:flex-start}}
  @media(prefers-reduced-motion:reduce){.go{animation:none!important}}
</style>
</head>
<body>
<canvas id="c3"></canvas>
<canvas id="hud"></canvas>
<div id="ov"></div>
<div id="err"></div>
<script src="three.min.js"></script>
<script src="settings.js"></script>
<script src="core.js"></script>
<script src="world.js"></script>
<script src="jets.js"></script>
<script src="enemies.js"></script>
<script src="game.js"></script>
</body>
</html>
